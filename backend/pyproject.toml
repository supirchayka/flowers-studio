[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "studio-backend"
version = "0.1.0"
description = "FastAPI backend for Telegram Mini App studio booking MVP"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.13.1",
  "aiosqlite>=0.20.0",
  "asyncpg>=0.30.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "pydantic-settings>=2.6.1",
  "sqlalchemy>=2.0.36",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
test = [
  "asgi-lifespan>=2.1.0",
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
